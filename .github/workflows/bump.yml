# Follow ThinkWatch Lite's releases.
#
# A tap that has to be edited by hand after every release is a tap that
# is a version behind most of the time. This checks for a newer release,
# and if there is one, records the checksum of the file it actually
# downloaded.
#
# **The release itself no longer waits for this schedule.** The app's
# release pipeline pushes the cask as soon as a release is published,
# using a deploy key that can write to this repository and nothing else,
# and it runs this same `scripts/bump.sh` to decide what to write.
#
# The schedule stays as the fallback: a revoked key, a failed step or a
# release published by hand all leave the cask behind, and the app waits
# for it. An app installed with Homebrew only offers an update once the
# cask here carries it — offering it earlier hands the user a `brew
# upgrade` that has nothing to install. Hourly, because every hour this
# lags is an hour those users are a version behind everyone else. A run
# with nothing to do finishes in seconds. Run it from the Actions tab to
# pick up a release immediately.
name: Bump

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    name: Follow the newest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the cask at the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/bump.sh

      - name: Commit if it moved
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing moved."
            exit 0
          fi
          VERSION=$(awk -F'"' '/^  version /{ print $2; exit }' Casks/thinkwatch-lite.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "thinkwatch-lite $VERSION"
          git push
